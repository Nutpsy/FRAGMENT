<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碎屑 - 个人空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
  <link rel="stylesheet" href="yunji-theme.css?v=4">
  <!-- marked.js for Markdown -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- MathJax for formulas -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JMDJHQ7RFM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JMDJHQ7RFM');
  </script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="nav" aria-label="主导航">
    <a href="#" class="nav-logo">碎屑</a>
    <div class="nav-links">
      <a href="#scintilla" class="nav-link"><span aria-hidden="true">01</span><span class="nav-link-label">日记</span></a>
      <a href="#inland-empire" class="nav-link"><span aria-hidden="true">02</span><span class="nav-link-label">影像</span></a>
      <a href="#gravity-rainbow" class="nav-link"><span aria-hidden="true">03</span><span class="nav-link-label">笔记</span></a>
      <a href="#manifesto" class="nav-link"><span aria-hidden="true">04</span><span class="nav-link-label">宣言</span></a>
    </div>
  </nav>

  <!-- 首页视图 -->
  <div id="view-home">
    <!-- Hero：直接使用陨迹生成动画，标题位于粒子层下方 -->
    <section class="hero" aria-labelledby="home-title">
      <h1 class="sr-only" id="home-title">碎屑</h1>
      <div class="hero-scene" aria-hidden="true">
        <canvas id="art" width="1440" height="900"></canvas>
      </div>
      <a class="hero-enter" href="#scintilla" aria-label="向下进入主页内容"><span aria-hidden="true">↓</span></a>
    </section>

    <!-- SCINTILLA -->
    <section id="scintilla" class="section scintilla-section">
      <div class="section-header">
        <span class="section-number">01</span>
        <h2 class="section-title">SCINTILLA</h2>
        <div class="section-line"></div>
        <a class="geo-enter-btn" href="#/archive/scintilla" title="进入归档">
          <span class="geo-enter-icon">→</span>
        </a>
      </div>
      <div class="scintilla-grid" id="scintilla-grid">
        <!-- JS 渲染 -->
      </div>
    </section>

    <!-- 内陆帝国 -->
    <section id="inland-empire" class="section inland-empire-section">
      <div class="section-header">
        <span class="section-number">02</span>
        <h2 class="section-title">内陆帝国</h2>
        <div class="section-line"></div>
        <a class="geo-enter-btn" href="#/archive/inland-empire" title="进入归档">
          <span class="geo-enter-icon">→</span>
        </a>
      </div>
      <div class="inland-empire-grid" id="inland-empire-grid">
        <!-- JS 渲染 -->
      </div>
    </section>

    <!-- 万有引力之虹 -->
    <section id="gravity-rainbow" class="section gravity-rainbow-section">
      <div class="section-header">
        <span class="section-number">03</span>
        <h2 class="section-title">万有引力之虹</h2>
        <div class="section-line"></div>
        <a class="geo-enter-btn" href="#/archive/gravity-rainbow" title="进入归档">
          <span class="geo-enter-icon">→</span>
        </a>
      </div>
      <div class="gravity-rainbow-container" id="gravity-rainbow-container">
        <!-- JS 渲染 -->
      </div>
    </section>

    <!-- 宣言 / 原台词区（无标题，砸在深色几何背景上） -->
    <section id="manifesto" class="section manifesto-section">
      <div class="manifesto-bg-geo"></div>
      <blockquote class="manifesto-quote">
        <p id="manifesto-text"></p>
      </blockquote>
    </section>

    <!-- B-side 隐秘入口 -->
    <button class="bside-trigger" id="bside-trigger" type="button" title="B-side" aria-label="打开 B-side 入口">
      <span class="bside-shape" aria-hidden="true"></span>
    </button>

    <!-- B-side 密码面板 -->
    <div class="bside-modal" id="bside-modal" role="dialog" aria-modal="true" aria-labelledby="bside-dialog-title">
      <div class="bside-panel">
        <button class="bside-close" id="bside-close" type="button" aria-label="关闭">✕</button>
        <div class="bside-hint" id="bside-dialog-title">B-SIDE ACCESS</div>
        <input type="password" class="bside-input" id="bside-input" maxlength="4" placeholder="####" inputmode="numeric" aria-label="B-side 四位密码">
        <div class="bside-hint-small">Hint: 生日</div>
        <button class="bside-submit" id="bside-submit">UNLOCK</button>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="footer-geo-line"></div>
      <div class="footer-content">
        <p class="footer-title">碎屑</p>
        <p class="footer-copy">© 2026 碎屑</p>
      </div>
    </footer>
  </div>

  <!-- 归档视图 -->
  <div id="view-archive" style="display:none">
    <div class="archive-page" id="archive-page-wrapper">
      <nav class="archive-nav" id="archive-nav"></nav>
      <div id="archive-content"></div>
    </div>
  </div>

  <script src="yunji-canvas-patch.js?v=1"></script>
  <script src="assets/yunji/meteor-lines.js?v=2"></script>
  <script src="data.js?v=10"></script>
  <script src="main.js?v=16"></script>
</body>
</html>
